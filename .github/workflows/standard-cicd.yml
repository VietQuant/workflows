name: PiCap CI/CD

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      module: 
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
      context:
        required: false
        type: string
        default: '.'
      cluster:
        required: false
        type: string
        default: 'office'
      shared-module:
        required: false
        type: string
        default: ''
      deploy-only:
        required: false
        type: boolean
        default: false
      build-only:
        required: false
        type: boolean
        default: false
      secret-scan:
        description: 'Run gitleaks secret scan on the source tree'
        required: false
        type: boolean
        default: true
      secret-scan-comment:
        description: 'Comment gitleaks findings on the PR (sticky) or on the commit'
        required: false
        type: boolean
        default: true
    secrets:
      REGISTRY_SERVER:
        required: true
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

jobs:
  secret-scan:
    name: Secret scan
    # Runs in parallel with the build job, warn only: never affects the CI/CD result
    continue-on-error: true
    if: ${{ inputs.secret-scan && ! inputs.deploy-only }}
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Secret scan (gitleaks)
        id: gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          SCAN_MODE: dir
        run: |
          set -euo pipefail
          # Install pinned gitleaks binary (MIT, no license / no scan quota)
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$RUNNER_TEMP/gitleaks-out"
          REPORT="$RUNNER_TEMP/gitleaks-out/gitleaks-report.json"
          COMMENT="$RUNNER_TEMP/gitleaks-out/comment.md"
          # .gitleaks.toml / .gitleaksignore in repo root are honored
          set +e
          "$RUNNER_TEMP/gitleaks" "$SCAN_MODE" . --redact --no-banner --report-format json --report-path "$REPORT" --exit-code 2
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
            echo "::error::gitleaks failed with exit code $RC"
            exit "$RC"
          fi
          COUNT=$(jq 'length' "$REPORT")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BLOB_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob"
          {
            echo "<!-- gitleaks-report -->"
            if [ "$COUNT" -eq 0 ]; then
              echo "### :white_check_mark: Gitleaks: no secrets found"
              echo ""
              echo "Commit \`${GITHUB_SHA::7}\` · [workflow run](${RUN_URL})"
            else
              echo "### :rotating_light: Gitleaks: $COUNT potential secret(s) found"
              echo ""
              echo "Commit \`${GITHUB_SHA::7}\` · scan mode \`${SCAN_MODE}\` · [workflow run](${RUN_URL})"
              echo ""
              echo "| Rule | Location | Commit | Fingerprint |"
              echo "|---|---|---|---|"
              jq -r --arg blob "$BLOB_URL" --arg sha "$GITHUB_SHA" '.[] | "| \(.RuleID) | [\(.File):\(.StartLine)](\($blob)/\(if .Commit == "" then $sha else .Commit end)/\(.File)#L\(.StartLine)) | \(if .Commit == "" then "-" else .Commit[0:7] end) | `\(.Fingerprint)` |"' "$REPORT"
              echo ""
              echo "Secrets are redacted. If a secret is real, **rotate it** — deleting it from code is not enough, it stays in git history."
              echo "False positive? Add the fingerprint to \`.gitleaksignore\` or an allowlist in \`.gitleaks.toml\`."
            fi
          } > "$COMMENT"
          sed '1d' "$COMMENT" >> "$GITHUB_STEP_SUMMARY"
          [ "$COUNT" -eq 0 ] && exit 0
          # Warn only: never fails the pipeline
          jq -r '.[] | "::warning file=\(.File),line=\(.StartLine)::gitleaks \(.RuleID)"' "$REPORT"
      -
        name: Upload gitleaks report
        if: ${{ always() && steps.gitleaks.outputs.count != '' && steps.gitleaks.outputs.count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-out/gitleaks-report.json
          retention-days: 14
      -
        name: Comment gitleaks result
        # Needs caller permissions: pull-requests: write (PR) / contents: write (commit comment).
        # Never fails the pipeline if the token lacks permission.
        if: ${{ always() && inputs.secret-scan-comment && steps.gitleaks.outputs.count != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.gitleaks.outputs.count }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          BODY="$RUNNER_TEMP/gitleaks-out/comment.md"
          MARKER='<!-- gitleaks-report -->'
          if [ -n "$PR_NUMBER" ]; then
            # PR: keep a single sticky comment, update it on every run
            ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
                  --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | tail -1)
            if [ -n "$ID" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -F body=@"$BODY" >/dev/null \
                && echo "Updated PR comment $ID" || echo "::warning::Cannot update PR comment (need pull-requests: write)"
            elif [ "$COUNT" != "0" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"$BODY" >/dev/null \
                && echo "Created PR comment" || echo "::warning::Cannot comment on PR (need pull-requests: write)"
            fi
          elif [ "$COUNT" != "0" ]; then
            # push / dispatch: comment on the commit, only when something is found
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@"$BODY" >/dev/null \
              && echo "Created commit comment" || echo "::warning::Cannot comment on commit (need contents: write)"
          fi
          exit 0

  cicd:
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      - 
        name: Set up Docker 
        if: ${{ ! inputs.deploy-only }}
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
      -
        name: Login to Registry
        if: ${{ ! inputs.deploy-only }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - 
        name: Generate Tag Version
        if: ${{ ! inputs.deploy-only }}
        id: version
        uses: paulhatch/semantic-version@v4.0.2
        with:
          bump_each_commit: true
      -
        name: Generate Image Tag
        if: ${{ ! inputs.deploy-only }}
        run: |
          echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-7`" >> $GITHUB_ENV
          echo "TAG=${{ steps.version.outputs.version }}-`echo ${GITHUB_SHA} | cut -c1-7`" >> $GITHUB_ENV
      -
        name: Build and Push
        if: ${{ ! inputs.deploy-only }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          file: ${{ inputs.dockerfile }}
          build-args: |
            REGISTRY_SERVER=${{ secrets.REGISTRY_SERVER }}
            PYPI_USERNAME=${{ secrets.PYPI_USERNAME }}
            PYPI_PASSWORD=${{ secrets.PYPI_PASSWORD }}
            MODULE=${{ inputs.module }}
          tags: ${{ secrets.REGISTRY_SERVER }}/${{ inputs.project }}:${{ env.TAG }},${{ secrets.REGISTRY_SERVER }}/${{ inputs.project}}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - 
        uses: azure/setup-helm@v3
        if: ${{ ! inputs.build-only }}
        with:
          version: '3.9.0' # default is latest (stable)
          token: ${{ secrets.GITHUB_TOKEN }} # only needed if version is 'latest'
      # -
      #   uses: boostport/setup-cloudflare-warp@v1
      #   if: ${{ ! inputs.build-only }}
      #   with:
      #     version: 2025.7.176.0
      #     organization: picap
      #     auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
      #     auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}
      -
        uses: Boostport/setup-cloudflare-warp@v1
        if: ${{ ! inputs.build-only }}
        with:
          organization: picap
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}
      -
        name: Helm deploy
        if: ${{ ! inputs.build-only }}
        env:
          HELM_KUBECONFIG: ${{ secrets.HELM_KUBECONFIG }}
        run: |
          helm registry login pysparks.azurecr.io -u ${{ secrets.HELM_USERNAME }} -p ${{ secrets.HELM_PASSWORD }}
          mkdir -p ~/.kube
          printf "$HELM_KUBECONFIG" > ~/.kube/config
          SHARED_MODULES=${{ inputs.shared-module }}
          for SHARED_MODULE in ${SHARED_MODULES//,/ }; do
            SET_SHARED_MODULES="$SET_SHARED_MODULES -f deploy/$SHARED_MODULE.yaml"
          done
          MODULES=${{ inputs.module }}
          for MODULE in ${MODULES//,/ }; do
            NAMESPACE=`grep -e '^namespace' deploy/${MODULE}.yaml | awk '{print $2}'`
            if [ -z "$NAMESPACE" ]; then
              for SHARED_MODULE in ${SHARED_MODULES//,/ }; do
                N=`grep -e '^namespace' deploy/${SHARED_MODULE}.yaml | awk '{print $2}'`
                [ -n "$N" ] && NAMESPACE=$N
              done
            fi
            IMAGE=`grep -e '^image' deploy/${MODULE}.yaml | awk '{print $2}'`
            RELEASE=`basename ${MODULE}`
            [ -z "$IMAGE" ] && IMAGE=${{ secrets.REGISTRY_SERVER }}/${{ inputs.project }}:${{ env.TAG }}
            echo "======================= Deploying $RELEASE to cluster '${{ inputs.cluster }}', namespace '$NAMESPACE' ======================="
            helm upgrade $RELEASE -i $SET_SHARED_MODULES -f deploy/${MODULE}.yaml oci://pysparks.azurecr.io/chart/common --version ${{ secrets.COMMON_CHART_VERSION }} -n $NAMESPACE --set image=$IMAGE --set project=${{ inputs.project }} --set module=$MODULE --set repo=${GITHUB_REPOSITORY} --set cluster=${{ inputs.cluster }} --kube-context=${{ inputs.cluster }} 
          done
