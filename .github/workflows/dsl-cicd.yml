name: DSL CI/CD

# Based on standard-cicd.yml, used only by VietQuant/dsl_future_strats.
# Differences:
#   - Image tag: <semver>-<sha7>-<rand8> (unique per build, never overwritten)
#   - deploy-only requires image-tag (unless deploy/<module>.yaml sets image)

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      module:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
      context:
        required: false
        type: string
        default: '.'
      cluster:
        required: false
        type: string
        default: 'office'
      shared-module:
        required: false
        type: string
        default: ''
      deploy-only:
        required: false
        type: boolean
        default: false
      build-only:
        required: false
        type: boolean
        default: false
      image-tag:
        description: 'Existing image tag to deploy when deploy-only is true'
        required: false
        type: string
        default: ''
    secrets:
      REGISTRY_SERVER:
        required: true
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

jobs:
  cicd:
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # semantic-version needs full history and tags
      -
        name: Set up Docker
        if: ${{ ! inputs.deploy-only }}
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
      -
        name: Login to Registry
        if: ${{ ! inputs.deploy-only }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      -
        name: Generate Tag Version
        if: ${{ ! inputs.deploy-only }}
        id: version
        uses: paulhatch/semantic-version@v4.0.2
        with:
          bump_each_commit: true
      -
        name: Generate Image Tag
        env:
          DEPLOY_ONLY: ${{ inputs.deploy-only }}
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ONLY" = "true" ]; then
            TAG="$INPUT_IMAGE_TAG"
          else
            RAND=$(cut -c1-8 /proc/sys/kernel/random/uuid)
            TAG="${VERSION}-${GITHUB_SHA::7}-${RAND}"
          fi
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "Image tag: ${TAG:-<none>}"
      -
        name: Build and Push
        if: ${{ ! inputs.deploy-only }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          file: ${{ inputs.dockerfile }}
          build-args: |
            REGISTRY_SERVER=${{ secrets.REGISTRY_SERVER }}
            PYPI_USERNAME=${{ secrets.PYPI_USERNAME }}
            PYPI_PASSWORD=${{ secrets.PYPI_PASSWORD }}
            MODULE=${{ inputs.module }}
          tags: ${{ secrets.REGISTRY_SERVER }}/${{ inputs.project }}:${{ env.TAG }},${{ secrets.REGISTRY_SERVER }}/${{ inputs.project}}:latest
          cache-from: type=gha,scope=${{ inputs.project }}-${{ inputs.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ inputs.project }}-${{ inputs.dockerfile }}
      -
        uses: azure/setup-helm@v3
        if: ${{ ! inputs.build-only }}
        with:
          version: '3.9.0' # default is latest (stable)
          token: ${{ secrets.GITHUB_TOKEN }} # only needed if version is 'latest'
      -
        uses: Boostport/setup-cloudflare-warp@v1
        if: ${{ ! inputs.build-only }}
        with:
          organization: picap
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}
      -
        name: Verify cluster API (gcp)
        if: ${{ ! inputs.build-only && inputs.cluster == 'gcp' }}
        env:
          HELM_KUBECONFIG: ${{ secrets.HELM_KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          printf '%s' "$HELM_KUBECONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "Runner egress IP (GKE master authorized networks: office VNPT/Viettel only):"
          curl -sf --max-time 15 https://ifconfig.me/ip || echo "unknown"
          echo ""
          if command -v warp-cli >/dev/null 2>&1; then warp-cli status || true; fi
          kubectl --context=gcp --request-timeout=30s cluster-info
      -
        name: Helm deploy
        if: ${{ ! inputs.build-only }}
        env:
          HELM_KUBECONFIG: ${{ secrets.HELM_KUBECONFIG }}
          HELM_USERNAME: ${{ secrets.HELM_USERNAME }}
          HELM_PASSWORD: ${{ secrets.HELM_PASSWORD }}
          COMMON_CHART_VERSION: ${{ secrets.COMMON_CHART_VERSION }}
          REGISTRY_SERVER: ${{ secrets.REGISTRY_SERVER }}
          PROJECT: ${{ inputs.project }}
          CLUSTER: ${{ inputs.cluster }}
          MODULES: ${{ inputs.module }}
          SHARED_MODULES: ${{ inputs.shared-module }}
        run: |
          set -euo pipefail
          echo "$HELM_PASSWORD" | helm registry login pysparks.azurecr.io -u "$HELM_USERNAME" --password-stdin
          mkdir -p ~/.kube
          printf '%s' "$HELM_KUBECONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
          SET_SHARED_MODULES=""
          for SHARED_MODULE in ${SHARED_MODULES//,/ }; do
            SET_SHARED_MODULES="$SET_SHARED_MODULES -f deploy/$SHARED_MODULE.yaml"
          done
          for MODULE in ${MODULES//,/ }; do
            NAMESPACE=$(grep -e '^namespace' deploy/${MODULE}.yaml | awk '{print $2}' || true)
            if [ -z "$NAMESPACE" ]; then
              for SHARED_MODULE in ${SHARED_MODULES//,/ }; do
                N=$(grep -e '^namespace' deploy/${SHARED_MODULE}.yaml | awk '{print $2}' || true)
                [ -n "$N" ] && NAMESPACE=$N
              done
            fi
            IMAGE=$(grep -e '^image' deploy/${MODULE}.yaml | awk '{print $2}' || true)
            RELEASE=$(basename ${MODULE})
            if [ -z "$IMAGE" ]; then
              if [ -z "$TAG" ]; then
                echo "::error::No image tag for $MODULE. Pass image-tag when deploy-only is true, or set image in deploy/${MODULE}.yaml"
                exit 1
              fi
              IMAGE=${REGISTRY_SERVER}/${PROJECT}:${TAG}
            fi
            echo "======================= Deploying $RELEASE to cluster '${CLUSTER}', namespace '$NAMESPACE' ======================="
            echo "Image: $IMAGE"
            helm upgrade $RELEASE -i $SET_SHARED_MODULES -f deploy/${MODULE}.yaml oci://pysparks.azurecr.io/chart/common --version ${COMMON_CHART_VERSION} -n $NAMESPACE --set image=$IMAGE --set project=${PROJECT} --set module=$MODULE --set repo=${GITHUB_REPOSITORY} --set cluster=${CLUSTER} --kube-context=${CLUSTER}
          done
