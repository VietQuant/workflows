name: DSL CI/CD

# Based on standard-cicd.yml, used only by VietQuant/dsl_future_strats.
# Differences:
#   - Image tag: <semver>-<sha7>-<rand8> (unique per build, never overwritten)
#   - deploy-only requires image-tag (unless deploy/<module>.yaml sets image)

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      module:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: 'Dockerfile'
      context:
        required: false
        type: string
        default: '.'
      cluster:
        required: false
        type: string
        default: 'office'
      shared-module:
        required: false
        type: string
        default: ''
      deploy-only:
        required: false
        type: boolean
        default: false
      build-only:
        required: false
        type: boolean
        default: false
      image-tag:
        description: 'Existing image tag to deploy when deploy-only is true'
        required: false
        type: string
        default: ''
      secret-scan:
        description: 'Run gitleaks secret scan on the source tree'
        required: false
        type: boolean
        default: true
      secret-scan-fail:
        description: 'Fail the pipeline when gitleaks finds secrets (false = warn only)'
        required: false
        type: boolean
        default: false
      secret-scan-comment:
        description: 'Comment gitleaks findings on the PR (sticky) or on the commit'
        required: false
        type: boolean
        default: true
    secrets:
      REGISTRY_SERVER:
        required: true
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

jobs:
  cicd:
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # semantic-version needs full history and tags
      -
        name: Secret scan (gitleaks)
        id: gitleaks
        if: ${{ inputs.secret-scan && ! inputs.deploy-only }}
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          FAIL_ON_LEAK: ${{ inputs.secret-scan-fail }}
          SCAN_MODE: dir
        run: |
          set -euo pipefail
          # Install pinned gitleaks binary (MIT, no license / no scan quota)
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          mkdir -p "$RUNNER_TEMP/gitleaks-out"
          REPORT="$RUNNER_TEMP/gitleaks-out/gitleaks-report.json"
          COMMENT="$RUNNER_TEMP/gitleaks-out/comment.md"
          # .gitleaks.toml / .gitleaksignore in repo root are honored
          set +e
          "$RUNNER_TEMP/gitleaks" "$SCAN_MODE" . --redact --no-banner --report-format json --report-path "$REPORT" --exit-code 2
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
            echo "::error::gitleaks failed with exit code $RC"
            exit "$RC"
          fi
          COUNT=$(jq 'length' "$REPORT")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BLOB_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob"
          {
            echo "<!-- gitleaks-report -->"
            if [ "$COUNT" -eq 0 ]; then
              echo "### :white_check_mark: Gitleaks: no secrets found"
              echo ""
              echo "Commit \`${GITHUB_SHA::7}\` · [workflow run](${RUN_URL})"
            else
              echo "### :rotating_light: Gitleaks: $COUNT potential secret(s) found"
              echo ""
              echo "Commit \`${GITHUB_SHA::7}\` · scan mode \`${SCAN_MODE}\` · [workflow run](${RUN_URL})"
              echo ""
              echo "| Rule | Location | Commit | Fingerprint |"
              echo "|---|---|---|---|"
              jq -r --arg blob "$BLOB_URL" --arg sha "$GITHUB_SHA" '.[] | "| \(.RuleID) | [\(.File):\(.StartLine)](\($blob)/\(if .Commit == "" then $sha else .Commit end)/\(.File)#L\(.StartLine)) | \(if .Commit == "" then "-" else .Commit[0:7] end) | `\(.Fingerprint)` |"' "$REPORT"
              echo ""
              echo "Secrets are redacted. If a secret is real, **rotate it** — deleting it from code is not enough, it stays in git history."
              echo "False positive? Add the fingerprint to \`.gitleaksignore\` or an allowlist in \`.gitleaks.toml\`."
            fi
          } > "$COMMENT"
          sed '1d' "$COMMENT" >> "$GITHUB_STEP_SUMMARY"
          [ "$COUNT" -eq 0 ] && exit 0
          LEVEL=warning; [ "$FAIL_ON_LEAK" = "true" ] && LEVEL=error
          jq -r --arg lvl "$LEVEL" '.[] | "::\($lvl) file=\(.File),line=\(.StartLine)::gitleaks \(.RuleID)"' "$REPORT"
          if [ "$FAIL_ON_LEAK" = "true" ]; then
            echo "::error::gitleaks found $COUNT potential secret(s)"
            exit 1
          fi
      -
        name: Upload gitleaks report
        if: ${{ always() && steps.gitleaks.outputs.count != '' && steps.gitleaks.outputs.count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-out/gitleaks-report.json
          retention-days: 14
      -
        name: Comment gitleaks result
        # Needs caller permissions: pull-requests: write (PR) / contents: write (commit comment).
        # Never fails the pipeline if the token lacks permission.
        if: ${{ always() && inputs.secret-scan-comment && steps.gitleaks.outputs.count != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.gitleaks.outputs.count }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          BODY="$RUNNER_TEMP/gitleaks-out/comment.md"
          MARKER='<!-- gitleaks-report -->'
          if [ -n "$PR_NUMBER" ]; then
            # PR: keep a single sticky comment, update it on every run
            ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
                  --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | tail -1)
            if [ -n "$ID" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -F body=@"$BODY" >/dev/null \
                && echo "Updated PR comment $ID" || echo "::warning::Cannot update PR comment (need pull-requests: write)"
            elif [ "$COUNT" != "0" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"$BODY" >/dev/null \
                && echo "Created PR comment" || echo "::warning::Cannot comment on PR (need pull-requests: write)"
            fi
          elif [ "$COUNT" != "0" ]; then
            # push / dispatch: comment on the commit, only when something is found
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@"$BODY" >/dev/null \
              && echo "Created commit comment" || echo "::warning::Cannot comment on commit (need contents: write)"
          fi
          exit 0
      -
        name: Set up Docker
        if: ${{ ! inputs.deploy-only }}
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
      -
        name: Login to Registry
        if: ${{ ! inputs.deploy-only }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      -
        name: Generate Tag Version
        if: ${{ ! inputs.deploy-only }}
        id: version
        uses: paulhatch/semantic-version@v4.0.2
        with:
          bump_each_commit: true
      -
        name: Generate Image Tag
        env:
          DEPLOY_ONLY: ${{ inputs.deploy-only }}
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ONLY" = "true" ]; then
            TAG="$INPUT_IMAGE_TAG"
          else
            RAND=$(cut -c1-8 /proc/sys/kernel/random/uuid)
            TAG="${VERSION}-${GITHUB_SHA::7}-${RAND}"
          fi
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "Image tag: ${TAG:-<none>}"
      -
        name: Build and Push
        if: ${{ ! inputs.deploy-only }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          file: ${{ inputs.dockerfile }}
          build-args: |
            REGISTRY_SERVER=${{ secrets.REGISTRY_SERVER }}
            PYPI_USERNAME=${{ secrets.PYPI_USERNAME }}
            PYPI_PASSWORD=${{ secrets.PYPI_PASSWORD }}
            MODULE=${{ inputs.module }}
          tags: ${{ secrets.REGISTRY_SERVER }}/${{ inputs.project }}:${{ env.TAG }},${{ secrets.REGISTRY_SERVER }}/${{ inputs.project}}:latest
          cache-from: type=gha,scope=${{ inputs.project }}-${{ inputs.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ inputs.project }}-${{ inputs.dockerfile }}
      -
        uses: azure/setup-helm@v3
        if: ${{ ! inputs.build-only }}
        with:
          version: '3.9.0' # default is latest (stable)
          token: ${{ secrets.GITHUB_TOKEN }} # only needed if version is 'latest'
      -
        uses: Boostport/setup-cloudflare-warp@v1
        if: ${{ ! inputs.build-only }}
        with:
          organization: picap
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}
      -
        name: Verify cluster API (gcp)
        if: ${{ ! inputs.build-only && inputs.cluster == 'gcp' }}
        env:
          HELM_KUBECONFIG: ${{ secrets.HELM_KUBECONFIG }}
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          printf '%s' "$HELM_KUBECONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "Runner egress IP (GKE master authorized networks: office VNPT/Viettel only):"
          curl -sf --max-time 15 https://ifconfig.me/ip || echo "unknown"
          echo ""
          if command -v warp-cli >/dev/null 2>&1; then warp-cli status || true; fi
          kubectl --context=gcp --request-timeout=30s cluster-info
      -
        name: Helm deploy
        if: ${{ ! inputs.build-only }}
        env:
          HELM_KUBECONFIG: ${{ secrets.HELM_KUBECONFIG }}
          HELM_USERNAME: ${{ secrets.HELM_USERNAME }}
          HELM_PASSWORD: ${{ secrets.HELM_PASSWORD }}
          COMMON_CHART_VERSION: ${{ secrets.COMMON_CHART_VERSION }}
          REGISTRY_SERVER: ${{ secrets.REGISTRY_SERVER }}
          PROJECT: ${{ inputs.project }}
          CLUSTER: ${{ inputs.cluster }}
          MODULES: ${{ inputs.module }}
          SHARED_MODULES: ${{ inputs.shared-module }}
        run: |
          set -euo pipefail
          echo "$HELM_PASSWORD" | helm registry login pysparks.azurecr.io -u "$HELM_USERNAME" --password-stdin
          mkdir -p ~/.kube
          printf '%s' "$HELM_KUBECONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
          SET_SHARED_MODULES=""
          for SHARED_MODULE in ${SHARED_MODULES//,/ }; do
            SET_SHARED_MODULES="$SET_SHARED_MODULES -f deploy/$SHARED_MODULE.yaml"
          done
          for MODULE in ${MODULES//,/ }; do
            NAMESPACE=$(grep -e '^namespace' deploy/${MODULE}.yaml | awk '{print $2}' || true)
            if [ -z "$NAMESPACE" ]; then
              for SHARED_MODULE in ${SHARED_MODULES//,/ }; do
                N=$(grep -e '^namespace' deploy/${SHARED_MODULE}.yaml | awk '{print $2}' || true)
                [ -n "$N" ] && NAMESPACE=$N
              done
            fi
            IMAGE=$(grep -e '^image' deploy/${MODULE}.yaml | awk '{print $2}' || true)
            RELEASE=$(basename ${MODULE})
            if [ -z "$IMAGE" ]; then
              if [ -z "$TAG" ]; then
                echo "::error::No image tag for $MODULE. Pass image-tag when deploy-only is true, or set image in deploy/${MODULE}.yaml"
                exit 1
              fi
              IMAGE=${REGISTRY_SERVER}/${PROJECT}:${TAG}
            fi
            echo "======================= Deploying $RELEASE to cluster '${CLUSTER}', namespace '$NAMESPACE' ======================="
            echo "Image: $IMAGE"
            helm upgrade $RELEASE -i $SET_SHARED_MODULES -f deploy/${MODULE}.yaml oci://pysparks.azurecr.io/chart/common --version ${COMMON_CHART_VERSION} -n $NAMESPACE --set image=$IMAGE --set project=${PROJECT} --set module=$MODULE --set repo=${GITHUB_REPOSITORY} --set cluster=${CLUSTER} --kube-context=${CLUSTER}
          done
